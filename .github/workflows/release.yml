name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action needs to create the draft release and upload assets
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # Build Intel macOS on an Intel runner. Cross-building this target on
          # Apple Silicon can compile successfully but fail while bundling DMGs.
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri-action invokes `pnpm tauri build` based on the packageManager
      # field; setup-vp manages pnpm internally but doesn't expose it on PATH
      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: true

      - name: build and lint frontend
        run: vp run build && vp lint

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple codesigning/notarization secrets (APPLE_CERTIFICATE etc.)
          # are not configured in this repo. Do NOT pass them as empty env
          # vars — the Tauri bundler treats an empty APPLE_CERTIFICATE as
          # "sign with this" and fails the build. Re-add them here when the
          # secrets actually exist.
        with:
          tagName: v__VERSION__
          releaseName: 'Ephemeral Text v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
