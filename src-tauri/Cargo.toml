[package]
name = "ephemeral-text"
version = "0.1.1"
description = "Ephemeral Text App"
authors = ["whaleen"]
edition = "2021"

[lib]
name = "ephemeral_text_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
